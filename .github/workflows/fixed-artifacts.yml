name: Fixed fork release artifacts

# Build reviewed fork source only. Never create tags or publish a Release.
on:
  push:
    branches: ["build/hghub-fixed-20261112"]
    paths: [".github/workflows/fixed-artifacts.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fixed-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ================= Windows：NSIS 安装包 + 便携包 =================
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Include license and build checksums
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf
        run: |
          set -euo pipefail
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nNoncommercial third-party build. No official code-signing credentials were used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ================= Android：未签名 APK（安装前必须自行签名） =================
  android:
    name: Android (unsigned APK per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 收集未签名 APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=0
          while IFS= read -r -d '' f; do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "artifacts/HGhub_${VERSION}_${abi}-unsigned.apk"
            found=$((found+1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' -print0)
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          printf '%s\n' 'These APKs are unsigned and cannot be installed until signed with your own Android signing key.' > artifacts/ANDROID-UNSIGNED.txt

      - name: Include license and build checksums
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf
        run: |
          set -euo pipefail
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nNoncommercial third-party build. No official code-signing credentials were used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ================= macOS：Universal（Apple Silicon + Intel）dmg =================
  macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos

      - run: pnpm install --frozen-lockfile

      # 打包目标（app + dmg）取自 src-tauri/tauri.macos.conf.json；未配置开发者证书，产物为 ad-hoc 签名
      - name: 构建（Universal dmg）
        run: pnpm tauri build --target universal-apple-darwin

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
             "artifacts/HGhub_${{ steps.ver.outputs.version }}_universal.dmg"
          ls -lh artifacts

      - name: Include license and build checksums
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf
        run: |
          set -euo pipefail
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nNoncommercial third-party build. No official code-signing credentials were used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ================= Linux：deb + AppImage =================
  linux:
    name: Linux (deb + appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - name: 安装系统依赖 (Tauri 2 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux

      - run: pnpm install --frozen-lockfile

      - name: Verify fixed source frontend and Rust
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          HGHUB_STRICT=1 cargo test --locked --manifest-path src-tauri/Cargo.toml --lib net::tests::untrusted_origins_reject_credentials_before_network -- --exact
          HGHUB_STRICT=0 cargo test --locked --manifest-path src-tauri/Cargo.toml --lib net::tests::untrusted_origins_reject_credentials_before_network -- --exact

      - name: 构建（deb + AppImage）
        run: pnpm tauri build --bundles deb appimage

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhub_${V}_amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "artifacts/HGhub_${V}_amd64.AppImage"
          ls -lh artifacts

      - name: Include license and build checksums
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf
        run: |
          set -euo pipefail
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nNoncommercial third-party build. No official code-signing credentials were used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14



  ios:
    name: iOS arm64 (requires personal signing)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci
          # 确保 iOS Info.plist（含 ~iphone / ~ipad 变体）支持横竖屏切换及 ATS
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"

      - name: 构建 iOS 应用与打包 IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: Label unsigned IPA and include installation requirements
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf
        run: |
          set -euo pipefail
          mv "artifacts/HGhub_${VERSION}_ios.ipa" "artifacts/HGhub_${VERSION}_ios-arm64-unsigned.ipa"
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nTarget: iOS arm64, minimum iOS 15.0\nSigning: unsigned; requires the recipient to sign before installation.\nValidation: release binary and IPA archive checked; physical-device installation and runtime not tested.\nNoncommercial third-party build; no Apple credentials or distribution certificate used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          cat > artifacts/IOS-INSTALL-README.txt <<'DOC'
          HGhub iOS 个人自签测试包（未签名）

          这不是 App Store/TestFlight 正式分发包，不能直接在 Safari 下载后安装。
          安装前需要用你自己的 Apple ID 签名。不要向本项目或他人发送 Apple ID 密码。

          免费路径：
          1. Mac 用户可用 Xcode 的 Personal Team 从源码构建安装。
          2. 也可在 Windows/Mac 从官方站点安装 Sideloadly，或使用 AltStore Classic，
             将本包导入后，用自己的 Apple ID 给自己的 iPhone/iPad 自签安装。
          3. 设备需按系统提示信任该开发者。iOS 16 或更新版本通常需要开启开发者模式。
          4. 免费签名有效期 7 天，需在过期前重新签名/刷新。免费账号每台设备
             最多同时安装 3 个此类应用。自动刷新仍取决于工具与电脑/设备连接条件。
          5. 更新时使用相同 Apple ID 和 Bundle ID；请先备份重要数据。

          项目目标：iOS/iPadOS 15.0 或更新版本，arm64 真机，不适用于模拟器。
          本包通过编译和归档结构检查；尚未进行真机安装、启动和播放验证。
          本项目包含第三方内容接口。代码许可不等于取得第三方内容授权。
          请遵守随附的 PolyForm Noncommercial 1.0.0 许可证，仅限授权范围内使用。

          官方说明：
          https://developer.apple.com/help/account/basics/about-your-developer-account
          https://sideloadly.io/faq
          https://faq.altstore.io/altstore-classic/your-altstore
          DOC
          python3 - <<'PY'
          import glob, plistlib, zipfile
          ipa, = glob.glob("artifacts/*-unsigned.ipa")
          with zipfile.ZipFile(ipa) as z:
              names = z.namelist()
              infos = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2]
              assert len(infos) == 1, infos
              assert not any(n.endswith("embedded.mobileprovision") for n in names), "Unexpected provisioning profile"
              info = plistlib.loads(z.read(infos[0]))
              executable = infos[0].removesuffix("Info.plist") + info["CFBundleExecutable"]
              assert z.getinfo(executable).file_size > 0
              assert info["CFBundleIdentifier"] == "com.hghub.huangguo", info
              assert info["CFBundleShortVersionString"] == __import__("os").environ["VERSION"], info
              print("Verified IPA:", ipa)
              print("Bundle ID:", info["CFBundleIdentifier"])
              print("Version:", info["CFBundleShortVersionString"])
              print("Minimum OS:", info.get("MinimumOSVersion"))
              print("Unsigned package: no embedded provisioning profile")
          PY
          (cd artifacts && shasum -a 256 -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14


  sign:
    needs: android
    name: Sign and verify Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Download verified unsigned build
        uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: unsigned

      - name: Check original build provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'Repository: nbbk/HGhub' unsigned/BUILD-INFO.txt
          grep -Fx 'Commit: 3cc9745b8cfa8dd17ff1c832026c8bdb0bb2a3cf' unsigned/BUILD-INFO.txt
          (cd unsigned && sha256sum -c SHA256SUMS)
          test "$(find unsigned -maxdepth 1 -name '*-unsigned.apk' | wc -l)" -eq 3

      - name: Sign APKs with persistent fork key and verify
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          KS="$RUNNER_TEMP/hghub-release.keystore"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          APKSIGNER="$SDK/build-tools/$BT/apksigner"
          ZIPALIGN="$SDK/build-tools/$BT/zipalign"
          AAPT="$SDK/build-tools/$BT/aapt"
          mkdir -p signed verification
          for f in unsigned/*-unsigned.apk; do
            name="$(basename "$f" -unsigned.apk)"
            aligned="$RUNNER_TEMP/${name}-aligned.apk"
            "$ZIPALIGN" -P 16 -f 4 "$f" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "signed/${name}.apk" "$aligned"
            "$APKSIGNER" verify --verbose --print-certs "signed/${name}.apk" | tee "verification/${name}.txt"
            "$ZIPALIGN" -P 16 -c 4 "signed/${name}.apk"
            "$AAPT" dump badging "signed/${name}.apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' >> "verification/${name}.txt"
          done
          EXPECTED_CERTIFICATE_SHA256="4d84a0afbc16b0b98ad762fff8da64738deb5b5c21970c9bbd2c89db7d260b77"
          for report in verification/*.txt; do
            grep -Eq "certificate SHA-256 digest: ${EXPECTED_CERTIFICATE_SHA256}$" "$report"
          done
          test "$(grep -h 'certificate SHA-256 digest:' verification/*.txt | sed 's/^.*digest: //' | sort -u | wc -l)" -eq 1
          cp unsigned/LICENSE.txt signed/LICENSE.txt
          cp unsigned/BUILD-INFO.txt signed/BUILD-INFO.txt
          printf '\nAndroid APKs signed with a dedicated nbbk/HGhub release key.\n' >> signed/BUILD-INFO.txt
          cat verification/*.txt > signed/ANDROID-SIGNATURE-VERIFICATION.txt
          (cd signed && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload only signed public artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-signed
          path: signed/*
          if-no-files-found: error
          retention-days: 14
