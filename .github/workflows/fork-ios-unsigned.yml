name: Fork iOS unsigned artifact

on:
  workflow_dispatch:
  push:
    branches: ["build/hghub-ios-unsigned-20261112"]
    paths: [".github/workflows/fork-ios-unsigned.yml", "scripts/build-ios-unsigned.sh"]

jobs:
  ios:
    name: iOS arm64 (requires personal signing)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci
          # 确保 iOS Info.plist（含 ~iphone / ~ipad 变体）支持横竖屏切换及 ATS
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"

      - name: 构建 iOS 应用与打包 IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: Label unsigned IPA and include installation requirements
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mv "artifacts/HGhub_${VERSION}_ios.ipa" "artifacts/HGhub_${VERSION}_ios-arm64-unsigned.ipa"
          cp LICENSE artifacts/LICENSE.txt
          printf 'Repository: %s\nCommit: %s\nTarget: iOS arm64, minimum iOS 15.0\nSigning: unsigned; requires the recipient to sign before installation.\nValidation: release binary and IPA archive checked; physical-device installation and runtime not tested.\nNoncommercial third-party build; no Apple credentials or distribution certificate used.\n' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT" > artifacts/BUILD-INFO.txt
          cat > artifacts/IOS-INSTALL-README.txt <<'DOC'
          HGhub iOS 个人自签测试包（未签名）

          这不是 App Store/TestFlight 正式分发包，不能直接在 Safari 下载后安装。
          安装前需要用你自己的 Apple ID 签名。不要向本项目或他人发送 Apple ID 密码。

          免费路径：
          1. Mac 用户可用 Xcode 的 Personal Team 从源码构建安装。
          2. 也可在 Windows/Mac 从官方站点安装 Sideloadly，或使用 AltStore Classic，
             将本包导入后，用自己的 Apple ID 给自己的 iPhone/iPad 自签安装。
          3. 设备需按系统提示信任该开发者。iOS 16 或更新版本通常需要开启开发者模式。
          4. 免费签名有效期 7 天，需在过期前重新签名/刷新。免费账号每台设备
             最多同时安装 3 个此类应用。自动刷新仍取决于工具与电脑/设备连接条件。
          5. 更新时使用相同 Apple ID 和 Bundle ID；请先备份重要数据。

          项目目标：iOS/iPadOS 15.0 或更新版本，arm64 真机，不适用于模拟器。
          本包通过编译和归档结构检查；尚未进行真机安装、启动和播放验证。
          本项目包含第三方内容接口。代码许可不等于取得第三方内容授权。
          请遵守随附的 PolyForm Noncommercial 1.0.0 许可证，仅限授权范围内使用。

          官方说明：
          https://developer.apple.com/help/account/basics/about-your-developer-account
          https://sideloadly.io/faq
          https://faq.altstore.io/altstore-classic/your-altstore
          DOC
          python3 - <<'PY'
          import glob, plistlib, zipfile
          ipa, = glob.glob("artifacts/*-unsigned.ipa")
          with zipfile.ZipFile(ipa) as z:
              names = z.namelist()
              infos = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2]
              assert len(infos) == 1, infos
              assert not any(n.endswith("embedded.mobileprovision") for n in names), "Unexpected provisioning profile"
              info = plistlib.loads(z.read(infos[0]))
              executable = infos[0].removesuffix("Info.plist") + info["CFBundleExecutable"]
              assert z.getinfo(executable).file_size > 0
              assert info["CFBundleIdentifier"] == "com.hghub.huangguo", info
              assert info["CFBundleShortVersionString"] == __import__("os").environ["VERSION"], info
              print("Verified IPA:", ipa)
              print("Bundle ID:", info["CFBundleIdentifier"])
              print("Version:", info["CFBundleShortVersionString"])
              print("Minimum OS:", info.get("MinimumOSVersion"))
              print("Unsigned package: no embedded provisioning profile")
          PY
          (cd artifacts && shasum -a 256 -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
