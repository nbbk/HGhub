[package]
name = "hghub-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
base64 = "0.22"
bytes = "1"
aes = "0.8"
percent-encoding = "2"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
async-stream = "0.3"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
